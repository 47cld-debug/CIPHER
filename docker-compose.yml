version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cipher_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password_123}
      POSTGRES_DB: ${DB_NAME:-employee_portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cipher_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password_123}@db:5432/${DB_NAME:-employee_portal}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-default_secret_key_please_change_in_production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
      # Add email SMTP settings here if needed
    volumes:
      - backend_uploads:/app/uploads
      - chroma_data:/app/chroma_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cipher_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
  chroma_data:
